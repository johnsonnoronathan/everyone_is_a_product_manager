<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Holiday Flash Sale</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <p class="badge">Flash sale</p>
    <h1 id="name">Loading…</h1>
    <p id="description"></p>
    <p class="price"><span id="price"></span> · <span id="stock" data-testid="stock"></span></p>

    <section aria-labelledby="checkout-heading">
      <h2 id="checkout-heading">Checkout</h2>
      <form id="login-form">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <button type="submit">Sign in</button>
      </form>
      <p id="signed-in" hidden></p>
      <button id="buy" type="button" disabled>Buy now</button>
      <p id="message" role="status" data-testid="message"></p>
    </section>

    <section aria-labelledby="reviews-heading">
      <h2 id="reviews-heading">Reviews</h2>
      <ul id="reviews"></ul>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
