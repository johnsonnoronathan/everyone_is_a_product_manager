name: Release

# Run from the Actions tab on main: enter a version that has its own "## <version>"
# section in CHANGELOG.md. It creates the tag v<version> and a GitHub release whose
# notes are that section.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, as written in CHANGELOG.md (for example 0.1.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Create the tag and release from CHANGELOG.md
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version must look like 1.2.3, got '$VERSION'"; exit 1; }
          awk -v v="$VERSION" '/^## / { if (found) exit; if ($2 == v) { found = 1; next } } found' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" || { echo "::error::CHANGELOG.md has no '## $VERSION' section"; exit 1; }
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
