name: Bug in a script
description: A script or test in this repository errors or behaves incorrectly.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What did you run, and what happened?
      description: Command, output (with secrets removed), and what you expected.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: OS, Node.js, k6 / Semgrep / Playwright if relevant
